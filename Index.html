<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>계속 쓴 글</title>
<style>
  body { margin:0; background:#f7f1e5; color:#2b2b2b; font-family:'Noto Serif KR', serif; }
  .wrap { max-width:720px; margin:0 auto; padding:48px 20px 80px; }
  header { text-align:center; margin-bottom:48px; }
  header h1 { font-size:32px; margin:0 0 8px; letter-spacing:0.02em; }
  header p { color:#7a6f5d; font-size:14px; margin:0; }
  .post { background:#fffdf8; border:1px solid #e8ddc9; border-radius:14px; padding:28px 26px; margin-bottom:20px; }
  .post h2 { margin:0 0 6px; font-size:22px; }
  .date { font-size:13px; color:#8a7f6d; margin-bottom:14px; }
  .post p { line-height:1.85; font-size:16px; margin:0; white-space:pre-line; }
  .empty { text-align:center; color:#8a7f6d; font-size:14px; line-height:1.8; padding:30px 0 10px; }
  footer { text-align:center; color:#9a8f7d; font-size:12px; margin-top:40px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>계속 쓴 글</h1>
    <p>일기처럼 시작해서 수필처럼 끝나는 기록</p>
  </header>

  <!-- 새 글은 아래 <div class="post"> 블록을 복사해서 위에 붙이면 돼 -->

  <div class="post">
    <h2>첫 글</h2>
    <div class="date">2026년 11월 13일</div>
    <p>여기에 첫 에세이가 들어갑니다.
너가 나한테 글을 보내면, 내가 이 파일에 날짜별로 계속 추가해줄게.</p>
  </div>

  <div class="empty">여기부터 차곡차곡 쌓일 거야.</div>
  <footer>© 2026 KW Kim. 모든 글은 창작자의 원본입니다.</footer>
</div>
</body>
</html>
